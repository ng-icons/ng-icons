# Nx Agents dynamic distribution. Nx Cloud picks a tier by the share of the
# workspace's projects that are affected, then launches that many agents:
#   small        1-25%  affected
#   medium      26-50%  affected
#   large       51-75%  affected
#   extra-large 76-100% affected  (e.g. an icon-source or core change rebuilds everything)
# These are small, fast projects, so a handful of agents is plenty - more just
# adds coordination overhead for tasks that each take seconds.
distribute-on:
  small-changeset: 1 linux-medium-js
  medium-changeset: 2 linux-medium-js
  large-changeset: 3 linux-medium-js
  extra-large-changeset: 3 linux-medium-js
