name: deploy

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest
    # Runs only on `main`, so it always uses the read-write cache token.
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v4
      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Cache the Playwright browser binary (only `core`'s browser test needs it).
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - uses: nrwl/nx-set-shas@v4

      # Distribute affected tasks across Nx Agents (scales with affected size).
      - run: pnpm exec nx-cloud start-ci-run --distribute-on=".nx/workflows/distribution-config.yaml" --stop-agents-after="lint,test,build"

      - run: pnpm exec nx generate @ng-icons/workspace-plugin:svg-to-ts
      - run: pnpm exec nx generate @ng-icons/workspace-plugin:update-readmes
      - run: pnpm exec nx-cloud record -- nx format:check
      - run: pnpm exec nx affected -t lint test build
      - run: pnpm exec nx build documentation

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/apps/documentation/browser # The folder the action should deploy.
