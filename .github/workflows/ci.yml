name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  main:
    runs-on: ubuntu-latest
    # Read-write cache token only on the protected `main` branch; PRs (incl. forks)
    # get an empty value and fall back to the read-only token in nx.json.
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_CLOUD_ACCESS_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v4

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Cache the Playwright browser binary (only `core`'s browser test needs it).
      # ponytail: system deps assumed present on the runner on a cache hit; if a
      # future runner image drops them, add `playwright install-deps` to the hit path.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # On a cache hit the binary is restored but the apt system deps aren't, so
      # install just those (fast) to avoid missing-library flakiness.
      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - uses: nrwl/nx-set-shas@v4

      # Regenerate the icon sets and the per-package READMEs, then fail if the
      # committed output is stale. Generation is deterministic (all sources are
      # pinned), so any diff means someone bumped a source or hand-edited
      # generated files without regenerating.
      - run: pnpm exec nx generate @ng-icons/workspace-plugin:svg-to-ts
      - run: pnpm exec nx generate @ng-icons/workspace-plugin:update-readmes
      - run: git add -A && git diff --staged --exit-code

      - run: pnpm exec nx-cloud record -- nx format:check
      - run: pnpm exec nx affected -t lint test build

      # The docs site reads all 40 icon packages off disk from the TypeScript
      # paths rather than importing them, so Nx's graph only links it to the
      # four it imports and `affected` skips it when an icon set changes. It
      # builds in seconds, so always build it: otherwise a bad icon set only
      # surfaces on `main`, during the deploy.
      - run: pnpm exec nx build documentation

      # `NgIconNameMap` only reaches consumers if ng-packagr keeps each entry
      # point's `declare module` block when it bundles the .d.ts. If a future
      # version drops it, every package still builds and publishes and the only
      # symptom is that everyone's `<ng-icon name="">` autocomplete goes empty.
      - name: Check the published types still carry the icon names
        if: hashFiles('dist/packages/*/package.json') != ''
        run: node tools/check-published-icon-types.mjs

      # Publish a preview build of the packages this commit touched, so a pull
      # request can be installed and tried before it is released:
      #
      #   pnpm add https://pkg.pr.new/@ng-icons/core@<sha>
      #
      # `nx affected` above already left dist/packages holding just those
      # packages and whatever they build against, so the glob scopes itself: a
      # PR touching one icon set uploads a few MB rather than the ~76 MB all 43
      # packages weigh together. A change to a shared input, such as the root
      # package.json or the lockfile, affects every project and does publish all
      # of them.
      #
      # Skipped when nothing in packages/ was affected, e.g. a docs-only or
      # workflow-only PR, because the glob would match nothing and the CLI
      # treats an empty publish as an error.
      #
      # One-time setup: install the pkg.pr.new GitHub App on the repository
      # (https://github.com/apps/pkg-pr-new). There is no token or secret - it
      # authenticates from the workflow run itself, which is also why this works
      # on pull requests from forks.
      - name: Publish preview packages
        if: hashFiles('dist/packages/*/package.json') != ''
        run: pnpm exec pkg-pr-new publish --commentWithSha './dist/packages/*'
